<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        'use strict';

        const USD_TO_EUR_RATE = 0.92;

        function convertUsdToEur(usdAmount) {
            if (typeof usdAmount !== 'number' || isNaN(usdAmount)) {
                throw new Error('Invalid amount');
            }
            return usdAmount * USD_TO_EUR_RATE;
        }

        const input = prompt('Enter amount in USD: ');
        const usd = Number(input);

        if (isNaN(usd)) {
            alert('Please enter a valid number');
        } else {
            const eur = convertUsdToEur(usd);
            alert(`EUR: ${eur.toFixed(2)}`)
        }
    </script>
</body>
</html>
