<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

    <h2>Авторизация</h2>

    <input type="text" id="login" placeholder="Логин">
    <input type="password" id="password" placeholder="Пароль">
    <button id="loginBtn">Войти</button>

    <p id="message" class="error"></p>

    <div id="menu" class="hidden">
        <h3>Меню</h3>
        <button id="calcBtn">Калькулятор</button>
        <button id="ageBtn">Проверка возраста</button>
        <button id="gameBtn">Игра</button>
        <button id="logoutBtn">Выйти</button>
    </div>

    <div id="calculator" class="hidden">
        <h3>Калькулятор</h3>

        <input type="number" id="num1" placeholder="Первое число">

        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <input type="number" id="num2" placeholder="Второе число">

        <button id="calcBtnDo">Вычислить</button>

        <p id="calcResult"></p>
    </div>

    <div id="ageBlock" class="hidden">
        <h3>Проверка возраста</h3>
        <input type="number" id="ageInput" placeholder="Введите возраст">
        <button id="checkAgeBtn">Проверить</button>
        <p id="ageResult"></p>
    </div>

    <div id="gameBlock" class="hidden">
        <h3>Игра: Угадай число (1-100)</h3>

        <input type="number" id="guessInput" placeholder="Введите число">
        <button id="guessBtn">Проверить</button>

        <p id="gameResult"></p>
    </div>

</div>

<script src="app.js"></script>

</body>
</html>
